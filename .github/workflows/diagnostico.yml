name: Diagnóstico de visibilidad

on:
  workflow_dispatch:

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - name: Calendario público (sin autenticar, como lo ve un visitante)
        run: |
          curl -s "https://github.com/users/superjai3/contributions" -o c.html
          echo "TOTAL PUBLICO: $(grep -o '[0-9,]* contributions in the last year' c.html | head -1)"
          echo "DIAS ENCENDIDOS: $(grep -o 'data-level="[1-4]"' c.html | wc -l)"
          echo "DIAS APAGADOS:   $(grep -o 'data-level="0"' c.html | wc -l)"

      - name: Lo que ve el GITHUB_TOKEN por GraphQL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -H "Authorization: bearer $GH_TOKEN" \
            -d '{"query":"{user(login:\"superjai3\"){contributionsCollection{contributionCalendar{totalContributions}restrictedContributionsCount}repositories(privacy:PRIVATE){totalCount}}}"}' \
            https://api.github.com/graphql
          echo
